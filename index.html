<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot UI - Gemini API</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK oficial de Google Gen AI para navegador -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body class="bg-slate-900 h-screen flex flex-col justify-between text-slate-100 font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="font-bold text-lg tracking-wide">Gemini UI Assistant</h1>
        </div>
        <span class="text-xs text-slate-400 bg-slate-700 px-2.5 py-1 rounded-full">v3.8 SDK Final</span>
    </header>

    <!-- Chat Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-indigo-600 text-white font-bold rounded-full h-8 w-8 flex items-center justify-center flex-shrink-0">AI</div>
            <div class="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl max-w-[80%] text-sm shadow-sm leading-relaxed">
                ¡Hola! Soy tu asistente virtual conectado a Gemini. ¿En qué te puedo ayudar hoy?
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4 shadow-lg">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Escribe tu mensaje aquí..." 
                autocomplete="off"
                required
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition-colors"
            >
            <button 
                type="submit" 
                id="send-button"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium text-sm transition-colors flex items-center justify-center min-w-[100px]"
            >
                Enviar
            </button>
        </form>
    </footer>

    <!-- Lógica usando el SDK oficial con manejo de errores limpio -->
<script type="module">
        import { GoogleGenAI } from "@google/genai";

        const API_KEY = "IDKasadasdasdasdasdasd";
        const ai = new GoogleGenAI({ apiKey: API_KEY });

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        const chat = ai.chats.create({
            model: 'gemini-3.8-flash',
            config: {
                systemInstruction: "Eres un asistente virtual amigable integrado en una interfaz de usuario escolar.",
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;
            sendButton.textContent = 'Pensando...';

            const loadingId = appendLoadingMessage();

            let success = false;
            let attempts = 0;
            let result = null;

            // Sistema de reintento automático si hay saturación temporal
            while (!success && attempts < 3) {
                try {
                    attempts++;
                    result = await chat.sendMessage({ message: text });
                    success = true;
                } catch (error) {
                    console.warn(`Intento ${attempts} fallido. Reintentando en 2 segundos...`, error);
                    if (attempts < 3) {
                        await new Promise(resolve => setTimeout(resolve, 2000)); // Espera 2s antes de reintentar
                    }
                }
            }
            
            document.getElementById(loadingId).remove();

            if (success && result && result.text) {
                appendMessage(result.text, 'bot');
            } else {
                appendMessage("El servidor está ocupado en este momento. Espera unos segundos y vuelve a intentar.", 'bot');
            }

            userInput.disabled = false;
            sendButton.disabled = false;
            sendButton.textContent = 'Enviar';
            userInput.focus();
        });

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `${isUser ? 'bg-emerald-600' : 'bg-indigo-600'} text-white font-bold rounded-full h-8 w-8 flex items-center justify-center flex-shrink-0 text-xs`;
            avatar.textContent = isUser ? 'TÚ' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = `${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-800 border border-slate-700 text-slate-100'} p-3.5 rounded-2xl max-w-[80%] text-sm shadow-sm leading-relaxed whitespace-pre-wrap`;
            bubble.textContent = text;

            wrapperDiv.appendChild(avatar);
            wrapperDiv.appendChild(bubble);
            chatContainer.appendChild(wrapperDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoadingMessage() {
            const id = 'loading-' + Date.now();
            const wrapperDiv = document.createElement('div');
            wrapperDiv.id = id;
            wrapperDiv.className = `flex items-start space-x-3`;

            const avatar = document.createElement('div');
            avatar.className = `bg-indigo-600 text-white font-bold rounded-full h-8 w-8 flex items-center justify-center flex-shrink-0 text-xs`;
            avatar.textContent = 'AI';

            const bubble = document.createElement('div');
            bubble.className = `bg-slate-800 border border-slate-700 p-3.5 rounded-2xl text-sm text-slate-400 italic`;
            bubble.textContent = 'Escribiendo respuesta...';

            wrapperDiv.appendChild(avatar);
            wrapperDiv.appendChild(bubble);
            chatContainer.appendChild(wrapperDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return id;
        }
    </script>
